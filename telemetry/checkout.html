<!doctype html>
<html><head><meta charset="utf-8"><title>Checkout</title>
<style>body{font-family:sans-serif;margin:40px;height:1800px} input{display:block;margin:8px 0;padding:6px;width:300px}</style>
</head><body>
<h1>Checkout</h1>
<p>Item: Wireless headphones — $129.00</p>
<form id="f" onsubmit="return false;">
<input id="name" placeholder="Full name">
<input id="email" placeholder="Email">
<input id="addr" placeholder="Address">
<input id="card" placeholder="Card number">
<input id="cvv" placeholder="CVV">
<button id="pay" type="submit">Pay</button>
</form>
<script>
const T0 = performance.now();
const ev = {mousemove:0, mousedown:0, click:0, keydown:0, keyup:0, input:0, paste:0, focus:0, scroll:0, wheel:0, pointermove:0, untrusted:0, total:0};
const keyTimes = []; const firstInput = {}; const fieldDone = {};
const moves = [];
function rec(e){ ev.total++; if(!e.isTrusted) ev.untrusted++; }
['mousemove','mousedown','click','keydown','keyup','paste','scroll','wheel','pointermove'].forEach(t=>
  window.addEventListener(t, e=>{ ev[t]++; rec(e);
    if(t==='keydown') keyTimes.push(performance.now());
    if(t==='mousemove' && moves.length<2000) moves.push([e.clientX,e.clientY,performance.now()]);
  }, true));
document.addEventListener('focusin', e=>{ev.focus++; rec(e);}, true);
document.addEventListener('input', e=>{ ev.input++; rec(e);
  const id=e.target.id; const t=performance.now();
  if(!(id in firstInput)) firstInput[id]=t; fieldDone[id]=t; }, true);
document.getElementById('pay').addEventListener('click', ()=>{
  const tSubmit = performance.now();
  const ikis = keyTimes.slice(1).map((t,i)=>t-keyTimes[i]);
  const mean = a=>a.length? a.reduce((x,y)=>x+y,0)/a.length : null;
  const sd = a=>{ if(a.length<2) return null; const m=mean(a); return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1)); };
  const fillDur = Object.keys(firstInput).map(k=>fieldDone[k]-firstInput[k]);
  // mouse path straightness: displacement / path length
  let pathLen=0; for(let i=1;i<moves.length;i++){pathLen+=Math.hypot(moves[i][0]-moves[i-1][0],moves[i][1]-moves[i-1][1]);}
  const disp = moves.length>1? Math.hypot(moves[moves.length-1][0]-moves[0][0], moves[moves.length-1][1]-moves[0][1]) : null;
  window.__telemetry = {
    ...ev,
    time_to_submit_ms: tSubmit - T0,
    iki_mean_ms: mean(ikis), iki_sd_ms: sd(ikis),
    field_fill_mean_ms: mean(fillDur),
    keydown_per_input: ev.input? ev.keydown/ev.input : null,
    mouse_straightness: (pathLen>0 && disp!==null)? disp/pathLen : null,
    webdriver: navigator.webdriver===true,
    plugins: navigator.plugins.length,
    languages: navigator.languages.length,
    ua_headless: /Headless/.test(navigator.userAgent),
    hw_conc: navigator.hardwareConcurrency,
  };
});
</script>
</body></html>
